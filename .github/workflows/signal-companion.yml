name: Signal companion research APK
on:
  push:
    branches: ['codex/signal-companion-ci']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signal-companion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Prepare pinned, isolated companion source
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.0.13004108"
          python3 integrations/signal-companion/prepare.py
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias AndroidDebugKey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 30
      - name: Verify primary registration is blocked without network
        working-directory: build/signal-companion/source
        run: ./gradlew --no-daemon --configuration-cache --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx4g -XX:ActiveProcessorCount=2 -XX:+UseG1GC' -Pkotlin.compiler.execution.strategy=in-process :lib:network:test --tests org.signal.network.api.CompanionRegistrationBoundaryTest
      - name: Build research APK without account credentials
        working-directory: build/signal-companion/source
        run: ./gradlew --no-daemon --configuration-cache --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx8g -XX:ActiveProcessorCount=2 -XX:+UseG1GC' -Pkotlin.compiler.execution.strategy=in-process :Signal-Android:assembleGithubProdSpinner
      - name: Package corresponding modified source
        run: |
          tar --exclude=.git --exclude=.gradle --exclude=.kotlin --exclude=build --exclude=local.properties -czf build/signal-companion-source.tar.gz -C build/signal-companion/source .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signal-companion-research
          path: |
            build/signal-companion/source/app/build/outputs/apk/**/*.apk
            build/signal-companion-source.tar.gz
            integrations/signal-companion/
          if-no-files-found: error
